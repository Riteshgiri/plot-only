<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #ffb020; --bg: #141418; --card: #1e1e24; --line: #2c2c34; --text: #ededf0; --muted: #9a9aa6; }
  body { width: 300px; margin: 0; padding: 16px; font: 13px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 32px; height: 32px; }
  h1 { font-size: 15px; margin: 0; }
  .tag { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 10px; }
  .switch { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 7px; color: var(--text); font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  .dot.ok { background: #3ecf8e; } .dot.bad { background: #ff6b6b; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  details { margin-top: 2px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  .inline { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); font-size: 12px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: #15151a; color: var(--text); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .tip { display: none; align-items: center; justify-content: center; gap: 7px; margin: 12px 0 4px; padding: 8px 10px; border-radius: 8px;
         background: #ffdd00; color: #1a1300; font-weight: 700; text-decoration: none; font-size: 13px; }
  .tip:hover { filter: brightness(0.95); }
  .tip.show { display: flex; }
  .tipnote { display: none; text-align: center; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .tipnote.show { display: block; }
  button { padding: 7px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #1a1300; cursor: pointer; font-weight: 700; }
  button.ghost { background: #2a2a32; color: var(--text); font-weight: 500; }
  #msg { color: #8fd18f; font-size: 12px; min-height: 16px; margin-top: 8px; }
  a { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <div><h1>Plot Only</h1><div class="tag">Watch the story, skip the filler</div></div>
  </header>

  <div class="card">
    <div class="switch"><div class="status"><span class="dot" id="dot"></span><span id="status">Checking connection…</span></div><input type="checkbox" id="enabled" title="Turn Plot Only on or off"></div>
  </div>

  <div class="row" style="margin-top:0">
    <button id="clear" class="ghost">Clear saved plans</button>
  </div>

  <details id="adv">
    <summary>Advanced</summary>
    <div class="inline"><input type="checkbox" id="ownKey"><span>Use my own Anthropic API key instead of the shared server</span></div>
    <label for="key">Anthropic API key (stored only in this browser)</label>
    <input type="password" id="key" placeholder="sk-ant-...">
    <label for="model">Model</label>
    <input type="text" id="model" placeholder="claude-sonnet-5-5">
    <div class="row"><button id="save">Save</button></div>
  </details>

  <a id="tip" class="tip" target="_blank" rel="noopener">☕ Buy me a coffee</a>
  <div id="tipnote" class="tipnote">Plot Only is free. Tips help cover the AI costs.</div>

  <div id="msg"></div>
  <a href="https://plot-only-api.riteshpgiri.workers.dev/privacy" target="_blank">Privacy policy</a>
  <script src="popup.js"></script>
</body>
</html>
